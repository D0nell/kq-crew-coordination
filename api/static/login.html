<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | KQ Crew Coordination</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif;
      background: #f1f5f9; color: #172033;
    }
    main {
      width: 100%; max-width: 420px; background: white; padding: 32px;
      border-radius: 14px; box-shadow: 0 12px 36px #0f172a12;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #64748b; line-height: 1.5; }
    label { display: block; margin-top: 18px; font-weight: 600; }
    input {
      display: block; width: 100%; margin-top: 8px; padding: 12px;
      border: 1px solid #cbd5e1; border-radius: 7px; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 24px; padding: 13px; border: 0;
      border-radius: 7px; background: #123b67; color: white;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 22px; color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>KQ Crew Coordination</h1>
    <p>Sign in with your assigned account to continue.</p>
    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username"
             required maxlength="160">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required maxlength="256">
      <p id="message" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const button = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: form.email.value.trim(),
            password: form.password.value
          })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "Unable to sign in.");
        }
        window.location.assign(result.redirect);
      } catch (error) {
        message.textContent = error.message || "Could not reach the server.";
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
