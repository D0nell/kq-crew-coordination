<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Transit Risk — Dispatcher Desk</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eceff2;
    --surface: #ffffff;
    --ink: #15202b;
    --ink-2: #44505c;
    --muted: #66727e;
    --line: #d8dde2;
    --line-soft: #e8ebee;
    --focus: #2459d6;
    --btn: #15202b;
    --btn-ink: #ffffff;
    --track: #dfe4e8;
    --fill: #55616d;
    --low-ink: #17673a;      --low-bg: #e1f2e7;
    --med-ink: #7a5600;      --med-bg: #fbf0cf;
    --high-ink: #9b3d00;     --high-bg: #fde5d3;
    --crit-ink: #a3121f;     --crit-bg: #fbdcdf;
    --ok-ink: #17673a;
    --bad-ink: #a3121f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151b;
      --surface: #18212a;
      --ink: #e8edf1;
      --ink-2: #b4bec8;
      --muted: #8e9aa6;
      --line: #2a3541;
      --line-soft: #222c36;
      --focus: #7aa2ff;
      --btn: #e8edf1;
      --btn-ink: #0f151b;
      --track: #2a3541;
      --fill: #8e9aa6;
      --low-ink: #7fd6a0;      --low-bg: #16301f;
      --med-ink: #ecc766;      --med-bg: #3a2f10;
      --high-ink: #f4a56e;     --high-bg: #3c2412;
      --crit-ink: #ff8f98;     --crit-bg: #421a1f;
      --ok-ink: #7fd6a0;
      --bad-ink: #ff8f98;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 24px 0; }
  .titlebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 20px; margin-top: 10px; }
  nav a { color: var(--ink-2); text-decoration: none; padding: 8px 0 9px; border-bottom: 2px solid transparent; font-size: 14px; }
  nav a[aria-current="page"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--ink); }
  nav a:hover { color: var(--ink); }
  .figures { display: flex; flex-wrap: wrap; gap: 8px 36px; padding: 14px 0 14px; }
  .fig { min-width: 0; }
  .fig .n { font-size: 24px; font-weight: 650; line-height: 1.1; }
  .fig .l { color: var(--muted); font-size: 12.5px; }
  .fig.replay .n { font-size: 20px; }
  .fig.replay .n small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 20px 24px 40px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px 12px 32px; } }
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 680px; }
  section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .panel > h2 { font-size: 15px; font-weight: 650; margin: 0; padding: 14px 16px 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
  label.f { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
  select, button { font: inherit; }
  select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
  button { cursor: pointer; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 11px; white-space: nowrap; }
  button.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button:hover:not(:disabled) { border-color: var(--ink-2); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  caption { text-align: left; padding: 10px 16px 0; color: var(--muted); font-size: 12.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  th { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 16px; }
  th:last-child, td:last-child { padding-right: 16px; text-align: right; }
  td.num, th.num { text-align: right; }
  tr.has-alert td:first-child { box-shadow: inset 3px 0 0 var(--crit-ink); }
  .route { font-weight: 600; }
  .who { color: var(--muted); font-size: 12.5px; }
  .when { white-space: nowrap; }
  .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 3px; padding: 1px 7px 1px 6px; font-size: 12.5px; font-weight: 650; }
  .tag svg { width: 9px; height: 9px; flex: none; fill: currentColor; }
  .LOW { background: var(--low-bg); color: var(--low-ink); }
  .MEDIUM { background: var(--med-bg); color: var(--med-ink); }
  .HIGH { background: var(--high-bg); color: var(--high-ink); }
  .CRITICAL { background: var(--crit-bg); color: var(--crit-ink); }
  .meter { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .track { position: relative; width: 84px; height: 6px; border-radius: 3px; background: var(--track); }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--fill); }
  .track i.over { background: var(--crit-ink); }
  .track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
  .p { min-width: 34px; text-align: right; font-weight: 600; }
  .na { color: var(--muted); }
  .match { font-size: 12.5px; font-weight: 600; }
  .match.ok { color: var(--ok-ink); } .match.bad { color: var(--bad-ink); }
  .pager { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--muted); font-size: 13px; }
  .empty { padding: 28px 16px; color: var(--ink-2); }
  .empty p { margin: 0 0 10px; }
  ul.alerts { list-style: none; margin: 0; padding: 0; }
  ul.alerts li { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  ul.alerts li:last-child { border-bottom: 0; }
  .a-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .a-meta { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
  .banner { margin: 12px 16px 0; padding: 10px 12px; border-radius: 4px; background: var(--crit-bg); color: var(--crit-ink); font-weight: 600; }
  .note { padding: 8px 24px; background: var(--med-bg); color: var(--med-ink); font-size: 12.5px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1>Crew transit risk</h1>
    <span class="sub" id="sub">Dispatcher desk</span>
  </div>
  <nav aria-label="Pages">
    <a href="/dashboard" aria-current="page">Transit queue</a>
    <a href="/predict">What-if prediction</a>
  </nav>
  <div class="figures" id="figures" aria-live="polite"></div>
</header>
<div class="note">Synthetic data. This view replays held-out test transits, so the recorded outcome can be compared with the model's prediction.</div>

<main>
  <section class="panel" aria-labelledby="qh">
    <h2 id="qh">Transit queue</h2>
    <div class="toolbar">
      <label class="f">Corridor
        <select id="corridor">
          <option value="">All corridors</option>
          <option>Mombasa Rd - JKIA</option><option>Westlands - JKIA</option><option>Embakasi - JKIA</option>
          <option>KQ Training Centre - JKIA</option><option>Medical Centre - JKIA</option><option>South B - JKIA</option>
        </select>
      </label>
      <label class="f">Show
        <select id="status">
          <option value="all">All</option><option value="unscored">Not scored yet</option>
          <option value="scored">Scored</option><option value="alert">With open alert</option>
        </select>
      </label>
      <label class="f"><input type="checkbox" id="outcome"> Show recorded outcome</label>
      <span class="spacer"></span>
      <button class="primary" id="scoreAll">Score these transits</button>
    </div>
    <div class="banner" id="error" role="alert" hidden></div>
    <div class="scroll"><table id="tbl" aria-busy="false">
      <caption id="cap"></caption>
      <thead><tr>
        <th>Pickup</th><th>Route and crew</th><th class="num">Risk</th>
        <th class="num">Delay probability</th><th class="outcome-col" hidden>Recorded outcome</th><th><span class="sr">Action</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="empty" class="empty" hidden></div>
    <div class="pager">
      <button id="prev">Previous</button><button id="next">Next</button>
      <span id="range"></span>
    </div>
  </section>

  <section class="panel" aria-labelledby="ah">
    <h2 id="ah">Alerts</h2>
    <div class="toolbar">
      <label class="f">Show
        <select id="astatus"><option value="open">Open</option><option value="resolved">Resolved</option></select>
      </label>
      <span class="who" id="acount"></span>
    </div>
    <ul class="alerts" id="alerts"></ul>
    <div id="aempty" class="empty" hidden></div>
  </section>
</main>

<script>
const SHAPES = {
  LOW: '<circle cx="5" cy="5" r="4.5"/>',
  MEDIUM: '<rect x=".5" y=".5" width="9" height="9"/>',
  HIGH: '<path d="M5 0 10 5 5 10 0 5z"/>',
  CRITICAL: '<path d="M5 0 10 10H0z"/>',
};
const $ = (id) => document.getElementById(id);
const state = { offset: 0, limit: 50, threshold: 0.5, items: [], total: 0 };

const fmtTime = (iso) => new Intl.DateTimeFormat('en-GB', {
  day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = (lvl) => `<span class="tag ${lvl}"><svg viewBox="0 0 10 10" aria-hidden="true">${SHAPES[lvl]}</svg>${lvl[0] + lvl.slice(1).toLowerCase()}</span>`;

async function api(path, opts) {
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error('Cannot reach the API. Check that the server is running.'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(typeof d === 'string' ? d : (d && d[0] && d[0].msg) || `Request failed (${res.status})`);
  }
  return body;
}
function showError(msg) { const b = $('error'); b.textContent = msg; b.hidden = !msg; }

function renderFigures(s) {
  state.threshold = s.alert_threshold;
  $('sub').textContent = `Model ${s.model_version}. Alerts raise at probability ${s.alert_threshold.toFixed(2)} or higher.`;
  const r = s.replay, f = (v) => (v == null ? '<span class="na">–</span>' : v.toFixed(2));
  $('figures').innerHTML = `
    <div class="fig"><div class="n">${s.scored}<small class="who"> of ${s.test_transits}</small></div><div class="l">transits scored</div></div>
    <div class="fig"><div class="n">${s.open_alerts}</div><div class="l">open alerts</div></div>
    <div class="fig replay" title="Predictions compared with the recorded outcome, on held-out test transits that have been scored">
      <div class="n">${f(r.precision)}<small>precision</small> &nbsp;${f(r.recall)}<small>recall</small> &nbsp;${f(r.f1)}<small>F1</small></div>
      <div class="l">${r.scored_test_transits ? `replay accuracy on ${r.scored_test_transits} scored transits` : 'score some transits to see replay accuracy'}</div>
    </div>`;
}

function meter(p) {
  if (p == null) return '<span class="na">Not scored</span>';
  const over = p >= state.threshold;
  return `<div class="meter"><div class="track" role="img" aria-label="Probability ${p.toFixed(2)}, alert at ${state.threshold.toFixed(2)}">
    <i class="${over ? 'over' : ''}" style="width:${(p * 100).toFixed(1)}%"></i><b style="left:${(state.threshold * 100).toFixed(1)}%"></b></div>
    <span class="p">${p.toFixed(2)}</span></div>`;
}
function outcomeCell(t) {
  const actual = ['HIGH', 'CRITICAL'].includes(t.actual_risk_class);
  const base = `${Math.round(t.actual_delay_minutes)} min late (${t.actual_risk_class.toLowerCase()})`;
  if (t.predicted_delayed == null) return base;
  const hit = t.predicted_delayed === actual;
  return `${base} <span class="match ${hit ? 'ok' : 'bad'}">${hit ? 'Match' : 'Miss'}</span>`;
}

function renderRows() {
  const showOut = $('outcome').checked;
  document.querySelectorAll('.outcome-col').forEach((el) => (el.hidden = !showOut));
  $('rows').innerHTML = state.items.map((t) => `
    <tr class="${t.open_alert ? 'has-alert' : ''}">
      <td class="when">${fmtTime(t.scheduled_pickup_time)}</td>
      <td><div class="route">${esc(t.corridor)}</div>
          <div class="who">#${t.transit_id} · ${esc(t.rank)} · ${esc(t.vehicle_type)} · to ${esc(t.destination)}</div></td>
      <td class="num">${t.risk_level ? tag(t.risk_level) : '<span class="na">–</span>'}</td>
      <td class="num">${meter(t.delay_probability)}</td>
      ${showOut ? `<td>${outcomeCell(t)}</td>` : ''}
      <td><button data-score="${t.transit_id}" aria-label="${t.delay_probability == null ? 'Score' : 'Re-score'} transit ${t.transit_id}">${t.delay_probability == null ? 'Score' : 'Re-score'}</button></td>
    </tr>`).join('');
  const none = state.items.length === 0;
  $('empty').hidden = !none;
  $('tbl').hidden = none;
  if (none) $('empty').innerHTML = '<p>No transits match these filters.</p><button id="reset">Clear filters</button>';
  $('scoreAll').disabled = none;
  const from = none ? 0 : state.offset + 1, to = state.offset + state.items.length;
  $('range').textContent = `Showing ${from}–${to} of ${state.total}`;
  $('cap').textContent = 'Test-split transits in pickup order';
  $('prev').disabled = state.offset === 0;
  $('next').disabled = to >= state.total;
}

function renderAlerts(a) {
  const open = $('astatus').value === 'open';
  $('acount').textContent = `${a.count} ${open ? 'open' : 'resolved'}`;
  $('alerts').innerHTML = a.items.map((x) => `
    <li>
      <div class="a-top">${tag(x.severity)} <strong>${esc(x.corridor)}</strong></div>
      ${x.resolved ? '' : `<button data-resolve="${x.alert_id}" aria-label="Resolve alert for transit ${x.transit_id}">Resolve</button>`}
      <div class="a-meta">#${x.transit_id} · ${esc(x.rank)} to ${esc(x.destination)} · pickup ${fmtTime(x.scheduled_pickup_time)} · probability ${Number(x.delay_probability).toFixed(2)}</div>
    </li>`).join('');
  $('aempty').hidden = a.items.length > 0;
  $('aempty').innerHTML = open
    ? '<p>No open alerts. Score transits in the queue to check them for delay risk.</p>'
    : '<p>No resolved alerts yet.</p>';
}

async function refresh() {
  $('tbl').setAttribute('aria-busy', 'true');
  const q = new URLSearchParams({ split: 'test', limit: state.limit, offset: state.offset, status: $('status').value });
  if ($('corridor').value) q.set('corridor', $('corridor').value);
  try {
    const [s, t, a] = await Promise.all([
      api('/api/summary'), api('/api/transits?' + q), api('/api/alerts?status=' + $('astatus').value)]);
    showError('');
    state.items = t.items; state.total = t.total;
    renderFigures(s); renderRows(); renderAlerts(a);
  } catch (e) { showError(e.message); }
  $('tbl').setAttribute('aria-busy', 'false');
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.score) { b.disabled = true; await api(`/api/transits/${b.dataset.score}/score`, { method: 'POST' }); }
    else if (b.dataset.resolve) { b.disabled = true; await api(`/api/alerts/${b.dataset.resolve}/resolve`, { method: 'PATCH' }); }
    else if (b.id === 'scoreAll') {
      b.disabled = true; b.textContent = 'Scoring…';
      await api('/api/transits/score-batch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transit_ids: state.items.map((t) => t.transit_id) }) });
      b.textContent = 'Score these transits';
    }
    else if (b.id === 'prev') { state.offset = Math.max(0, state.offset - state.limit); }
    else if (b.id === 'next') { state.offset += state.limit; }
    else if (b.id === 'reset') { $('corridor').value = ''; $('status').value = 'all'; state.offset = 0; }
    else return;
    await refresh();
  } catch (err) { showError(err.message); b.disabled = false; if (b.id === 'scoreAll') b.textContent = 'Score these transits'; }
});
['corridor', 'status'].forEach((id) => $(id).addEventListener('change', () => { state.offset = 0; refresh(); }));
$('astatus').addEventListener('change', refresh);
$('outcome').addEventListener('change', renderRows);
refresh();
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</body>
</html>
